<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ikigai Finder">
  <!--
    Simplified four-circle mark from the index diagram.
    Colors match .diagram-circle fills; opacity slightly boosted for 16–32px.
    Geometry: love top, good left, world right, paid bottom.
  -->
  <rect width="32" height="32" rx="6" fill="#f7f8fc"/>
  <g fill-opacity="0.72" stroke="#fff" stroke-width="0.55" stroke-opacity="0.9">
    <!-- love -->
    <circle cx="16" cy="10.4" r="9.2" fill="rgb(120, 169, 237)"/>
    <!-- good -->
    <circle cx="10.1" cy="16.2" r="9.2" fill="rgb(195, 166, 230)"/>
    <!-- world (diagram uses lower opacity) -->
    <circle cx="21.9" cy="16.2" r="9.2" fill="rgb(146, 120, 222)" fill-opacity="0.55"/>
    <!-- paid -->
    <circle cx="16" cy="21.6" r="9.2" fill="rgb(120, 169, 237)"/>
  </g>
</svg>
